<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs><style>.h{font:700 28px Arial;fill:#16324f}.t{font:17px Arial;fill:#16324f}.s{font:14px Arial;fill:#44627c}.arrow{stroke:#64748b;stroke-width:4;fill:none}.n{fill:#93c5fd}.p{fill:#fbbf24}.m{fill:#f59e0b}.r{fill:#ef4444}.w{fill:#f8fafc;stroke:#64748b}.ns{fill:#7c3aed}.bh{fill:#111827}</style></defs>
  <rect width="960" height="540" fill="#fff"/><text x="35" y="48" class="h">Stellar evolution is controlled mainly by initial mass</text>
  <circle cx="105" cy="215" r="50" class="n"/><text x="72" y="290" class="t">Nebula</text><line x1="160" y1="215" x2="240" y2="215" class="arrow"/>
  <circle cx="290" cy="215" r="42" class="p"/><text x="250" y="290" class="t">Protostar</text><line x1="335" y1="215" x2="415" y2="215" class="arrow"/>
  <circle cx="465" cy="215" r="48" class="m"/><text x="405" y="290" class="t">Main sequence</text>
  <path d="M520 205 C590 180 625 135 680 115" class="arrow"/><path d="M520 225 C590 255 625 320 680 350" class="arrow"/>
  <circle cx="735" cy="105" r="65" class="r"/><text x="685" y="190" class="t">Red giant</text><line x1="790" y1="145" x2="850" y2="200" class="arrow"/><circle cx="885" cy="230" r="28" class="w"/><text x="825" y="285" class="s">white dwarf</text>
  <circle cx="735" cy="360" r="82" class="r"/><text x="670" y="470" class="t">Supergiant</text><line x1="815" y1="340" x2="860" y2="310" class="arrow"/><circle cx="885" cy="285" r="24" class="ns"/><text x="820" y="335" class="s">neutron star</text><line x1="815" y1="385" x2="860" y2="410" class="arrow"/><circle cx="885" cy="430" r="30" class="bh"/><text x="835" y="485" class="s">black hole</text>
  <text x="80" y="510" class="s">Hydrostatic equilibrium supports the main-sequence star; fuel exhaustion changes the core and drives later stages.</text>
</svg>
