<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs><style>.h{font:700 28px Arial;fill:#16324f}.t{font:18px Arial;fill:#16324f}.s{font:15px Arial;fill:#44627c}.axis{stroke:#16324f;stroke-width:3}.low{fill:#0ea5e9}.high{fill:#8b5cf6}.eq{font:25px Georgia;fill:#16324f}</style></defs>
  <rect width="960" height="540" fill="#fff"/><text x="35" y="48" class="h">Boltzmann population law</text>
  <g transform="translate(60,95)"><line x1="65" y1="340" x2="500" y2="340" class="axis"/><line x1="65" y1="340" x2="65" y2="30" class="axis"/><text x="470" y="375" class="s">energy E</text><text x="10" y="45" class="s">population</text><path d="M70 65 C160 105 250 175 470 325" fill="none" stroke="#0ea5e9" stroke-width="6"/><path d="M70 95 C175 130 285 210 470 330" fill="none" stroke="#8b5cf6" stroke-width="5"/><text x="165" y="100" class="t">lower T</text><text x="300" y="185" class="t">higher T</text></g>
  <g transform="translate(610,105)"><rect width="300" height="310" rx="18" fill="#f7fbff" stroke="#c8d9e7"/><text x="25" y="55" class="t">Two-level ratio</text><text x="25" y="115" class="eq">N₂/N₁ = e⁻Δᴱ⁄ᵏᵀ</text><text x="25" y="175" class="s">Higher energy states are less</text><text x="25" y="200" class="s">populated at finite temperature.</text><text x="25" y="250" class="s">Increasing T makes the population</text><text x="25" y="275" class="s">distribution less strongly concentrated.</text></g>
</svg>
