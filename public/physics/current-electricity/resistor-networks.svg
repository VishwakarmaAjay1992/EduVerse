<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560">
  <defs><style>.h{font:700 28px Arial;fill:#12304d}.t{font:18px Arial;fill:#12304d}.s{font:15px Arial;fill:#47627b}.wire{stroke:#12304d;stroke-width:3;fill:none}.r{stroke:#2563eb;stroke-width:4;fill:none}.g{stroke:#0f766e;stroke-width:4;fill:none}</style></defs><rect width="960" height="560" fill="#fff"/><text x="38" y="48" class="h">Resistor networks and colour codes</text>
  <g transform="translate(55 95)"><text x="0" y="0" class="t">Series</text><line x1="10" y1="95" x2="80" y2="95" class="wire"/><path d="M80 95h25l12-20 22 40 22-40 22 40 12-20h25" class="r"/><path d="M220 95h25l12-20 22 40 22-40 22 40 12-20h25" class="r"/><line x1="360" y1="95" x2="420" y2="95" class="wire"/><text x="125" y="55" class="s">R₁</text><text x="265" y="55" class="s">R₂</text><text x="70" y="155" class="s">Req = R₁ + R₂</text></g>
  <g transform="translate(500 95)"><text x="0" y="0" class="t">Parallel</text><line x1="20" y1="45" x2="20" y2="165" class="wire"/><line x1="360" y1="45" x2="360" y2="165" class="wire"/><line x1="20" y1="65" x2="110" y2="65" class="wire"/><path d="M110 65h25l12-20 22 40 22-40 22 40 12-20h25" class="g"/><line x1="250" y1="65" x2="360" y2="65" class="wire"/><line x1="20" y1="145" x2="110" y2="145" class="wire"/><path d="M110 145h25l12-20 22 40 22-40 22 40 12-20h25" class="g"/><line x1="250" y1="145" x2="360" y2="145" class="wire"/><text x="100" y="205" class="s">1/Req = 1/R₁ + 1/R₂</text></g>
  <g transform="translate(70 330)"><text x="0" y="0" class="t">Four-band resistor</text><rect x="35" y="35" width="300" height="85" rx="35" fill="#e8d3a8" stroke="#12304d" stroke-width="3"/><rect x="105" y="35" width="20" height="85" fill="#7c2d12"/><rect x="145" y="35" width="20" height="85" fill="#111827"/><rect x="185" y="35" width="20" height="85" fill="#dc2626"/><rect x="255" y="35" width="20" height="85" fill="#d4af37"/><text x="20" y="160" class="s">brown-black-red-gold = 10 × 10² Ω = 1 kΩ, ±5%</text></g>
  <g transform="translate(515 320)"><text x="0" y="0" class="t">Balanced bridge</text><polygon points="40,105 180,25 320,105 180,185" class="wire"/><line x1="40" y1="105" x2="320" y2="105" class="r"/><circle cx="180" cy="105" r="17" fill="#fff" stroke="#12304d" stroke-width="3"/><text x="173" y="112" class="s">G</text><text x="80" y="55" class="s">P</text><text x="260" y="55" class="s">Q</text><text x="80" y="180" class="s">R</text><text x="260" y="180" class="s">S</text><text x="55" y="225" class="s">At balance P/Q = R/S and detector current is zero.</text></g>
</svg>
