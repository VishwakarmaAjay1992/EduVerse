<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560">
  <defs><style>.h{font:700 28px Arial;fill:#12304d}.t{font:18px Arial;fill:#12304d}.s{font:15px Arial;fill:#47627b}.box{stroke:#12304d;stroke-width:3;fill:#eff8ff}.path{stroke:#38bdf8;stroke-width:3;fill:none}.drift{stroke:#2563eb;stroke-width:5;fill:none}.field{stroke:#e11d48;stroke-width:5;fill:none}</style><marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#2563eb"/></marker><marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#e11d48"/></marker></defs>
  <rect width="960" height="560" fill="#fff"/><text x="38" y="48" class="h">Electron collisions and net drift</text><rect x="65" y="100" width="830" height="250" rx="18" class="box"/>
  <g fill="#f59e0b"> <circle cx="150" cy="160" r="18"/><circle cx="280" cy="270" r="18"/><circle cx="420" cy="145" r="18"/><circle cx="565" cy="280" r="18"/><circle cx="720" cy="160" r="18"/><circle cx="830" cy="275" r="18"/></g>
  <path d="M105 300L155 210L235 245L315 130L395 235L485 165L575 225L665 125L760 230L860 145" class="path"/><g fill="#2563eb"><circle cx="105" cy="300" r="9"/><circle cx="315" cy="130" r="9"/><circle cx="575" cy="225" r="9"/><circle cx="860" cy="145" r="9"/></g>
  <line x1="800" y1="72" x2="200" y2="72" class="drift" marker-end="url(#a1)"/><text x="380" y="62" class="t">small electron drift vₙ</text><line x1="180" y1="382" x2="820" y2="382" class="field" marker-end="url(#a2)"/><text x="390" y="416" class="t">electric field E and conventional current</text>
  <g transform="translate(85 445)"><rect width="790" height="80" rx="14" fill="#f5f9fc" stroke="#c5d5e3"/><text x="20" y="32" class="s">Between collisions: a = -eE/m. Averaging over relaxation time τ gives vₙ = -eτE/m.</text><text x="20" y="58" class="s">The thermal path is fast and random; only its tiny directional bias produces current.</text></g>
</svg>
