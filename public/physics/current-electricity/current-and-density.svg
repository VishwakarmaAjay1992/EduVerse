<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560">
  <defs><style>.h{font:700 28px Arial;fill:#12304d}.t{font:18px Arial;fill:#12304d}.s{font:15px Arial;fill:#47627b}.w{stroke:#12304d;stroke-width:3;fill:#dff3ff}.a{stroke:#e11d48;stroke-width:5;fill:none}.b{stroke:#2563eb;stroke-width:5;fill:none}.d{stroke:#0f766e;stroke-width:2;fill:none;stroke-dasharray:7 5}</style><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#e11d48"/></marker><marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#2563eb"/></marker></defs>
  <rect width="960" height="560" fill="#fff"/><text x="38" y="48" class="h">Current, electron drift and current density</text>
  <rect x="80" y="120" width="800" height="180" rx="80" class="w"/><ellipse cx="760" cy="210" rx="82" ry="76" fill="#c7e9ff" stroke="#12304d" stroke-width="3"/>
  <line x1="160" y1="90" x2="760" y2="90" class="a" marker-end="url(#ar)"/><text x="360" y="76" class="t">conventional current I</text>
  <line x1="760" y1="330" x2="190" y2="330" class="b" marker-end="url(#ab)"/><text x="360" y="365" class="t">electron drift direction</text>
  <line x1="760" y1="125" x2="760" y2="295" class="d"/><text x="790" y="212" class="t">area A</text>
  <g fill="#2563eb"> <circle cx="170" cy="170" r="10"/><circle cx="250" cy="235" r="10"/><circle cx="330" cy="175" r="10"/><circle cx="410" cy="245" r="10"/><circle cx="490" cy="170" r="10"/><circle cx="575" cy="235" r="10"/><circle cx="655" cy="170" r="10"/></g>
  <g transform="translate(75 410)"><rect width="810" height="105" rx="15" fill="#f5f9fc" stroke="#c5d5e3"/><text x="20" y="34" class="t">Key relations</text><text x="20" y="67" class="s">I = dQ/dt    •    J = I/A for a normal uniform cross-section    •    I = ∫ J · dA</text><text x="20" y="92" class="s">For mobile carriers: J = nqv and I = nqAv. Steady current remains continuous through the wire.</text></g>
</svg>
