<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560"><defs><style>.h{font:700 28px Arial;fill:#12304d}.t{font:18px Arial;fill:#12304d}.s{font:15px Arial;fill:#47627b}.w{stroke:#12304d;stroke-width:3;fill:none}.heat{stroke:#e11d48;stroke-width:6;fill:none}.flame{stroke:#f59e0b;stroke-width:3;fill:none}</style></defs><rect width="960" height="560" fill="#fff"/><text x="38" y="48" class="h">Electrical power, heating and protection</text>
<g transform="translate(65 95)"><text x="0" y="0" class="t">Resistive heating</text><path d="M30 120h75l18-30 30 60 30-60 30 60 30-60 30 60 18-30h90" class="heat"/><path d="M145 60q18-35 36 0M205 60q18-35 36 0M265 60q18-35 36 0" class="flame"/><text x="50" y="195" class="s">P = VI = I²R = V²/R</text><text x="50" y="225" class="s">H = Pt</text></g>
<g transform="translate(500 90)"><text x="0" y="0" class="t">Fuse in series</text><path d="M20 115H145" class="w"/><rect x="145" y="90" width="110" height="50" rx="10" fill="#fff0c2" stroke="#f59e0b" stroke-width="3"/><text x="180" y="122" class="s">FUSE</text><path d="M255 115h45l12-20 22 40 22-40 22 40 12-20h70" class="w"/><text x="310" y="175" class="s">load</text><text x="30" y="225" class="s">Excess current melts the fuse and opens the path.</text></g>
<g transform="translate(80 355)"><rect width="800" height="130" rx="16" fill="#f5f9fc" stroke="#c5d5e3"/><text x="20" y="38" class="t">Energy and safe operation</text><text x="20" y="72" class="s">1 kWh = 3.6 × 10⁶ J. Device ratings state intended voltage and power.</text><text x="20" y="100" class="s">Household appliances are wired in parallel; protective devices must use approved current ratings.</text></g></svg>
