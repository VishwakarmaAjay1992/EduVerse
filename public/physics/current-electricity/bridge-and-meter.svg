<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560"><defs><style>.h{font:700 28px Arial;fill:#12304d}.t{font:18px Arial;fill:#12304d}.s{font:15px Arial;fill:#47627b}.w{stroke:#12304d;stroke-width:3;fill:none}.b{stroke:#2563eb;stroke-width:4;fill:none}.a{stroke:#f59e0b;stroke-width:4;fill:none}</style></defs><rect width="960" height="560" fill="#fff"/><text x="38" y="48" class="h">Wheatstone bridge and meter bridge</text>
<g transform="translate(60 95)"><text x="0" y="0" class="t">Wheatstone bridge</text><polygon points="65,150 230,45 395,150 230,255" class="w"/><line x1="65" y1="150" x2="395" y2="150" class="b"/><circle cx="230" cy="150" r="20" fill="#fff" stroke="#12304d" stroke-width="3"/><text x="223" y="158" class="s">G</text><text x="130" y="85" class="s">P</text><text x="325" y="85" class="s">Q</text><text x="130" y="245" class="s">R</text><text x="325" y="245" class="s">S</text><text x="70" y="305" class="s">Balance: P/Q = R/S</text></g>
<g transform="translate(510 95)"><text x="0" y="0" class="t">One-metre bridge</text><line x1="20" y1="170" x2="390" y2="170" class="b" stroke-width="8"/><line x1="20" y1="130" x2="20" y2="210" class="w"/><line x1="390" y1="130" x2="390" y2="210" class="w"/><circle cx="240" cy="170" r="13" fill="#f59e0b"/><line x1="240" y1="170" x2="240" y2="70" class="a"/><text x="205" y="55" class="s">jockey / null point</text><text x="10" y="245" class="s">l</text><text x="310" y="245" class="s">100 - l</text><text x="45" y="305" class="s">X/R = l/(100-l)</text></g>
<g transform="translate(95 425)"><rect width="770" height="85" rx="15" fill="#f5f9fc" stroke="#c5d5e3"/><text x="20" y="32" class="s">Null methods compare potential without relying on detector calibration. At balance, the galvanometer current is zero.</text><text x="20" y="60" class="s">A central balance point reduces end error and improves sensitivity.</text></g></svg>
