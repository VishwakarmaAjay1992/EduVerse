<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560">
  <defs><style>.h{font:700 28px Arial;fill:#12304d}.t{font:18px Arial;fill:#12304d}.s{font:15px Arial;fill:#47627b}.ax{stroke:#12304d;stroke-width:3}.ohm{stroke:#2563eb;stroke-width:5;fill:none}.non{stroke:#e11d48;stroke-width:5;fill:none}.metal{stroke:#f97316;stroke-width:5;fill:none}.semi{stroke:#0f766e;stroke-width:5;fill:none}</style></defs>
  <rect width="960" height="560" fill="#fff"/><text x="38" y="48" class="h">Resistance, nonlinearity and temperature</text>
  <g transform="translate(60 100)"><text x="0" y="0" class="t">V-I characteristics</text><line x1="55" y1="210" x2="380" y2="210" class="ax"/><line x1="55" y1="210" x2="55" y2="25" class="ax"/><line x1="55" y1="210" x2="340" y2="45" class="ohm"/><path d="M55 210C150 205 170 170 220 125S310 80 350 35" class="non"/><text x="300" y="72" class="s">non-ohmic</text><text x="260" y="135" class="s">ohmic</text><text x="350" y="238" class="s">I</text><text x="25" y="35" class="s">V</text></g>
  <g transform="translate(500 100)"><text x="0" y="0" class="t">Resistance versus temperature</text><line x1="50" y1="210" x2="380" y2="210" class="ax"/><line x1="50" y1="210" x2="50" y2="25" class="ax"/><line x1="65" y1="195" x2="345" y2="45" class="metal"/><line x1="65" y1="45" x2="345" y2="190" class="semi"/><text x="270" y="55" class="s">metal</text><text x="250" y="185" class="s">semiconductor</text><text x="340" y="238" class="s">T</text><text x="15" y="35" class="s">R</text></g>
  <g transform="translate(85 385)"><rect width="790" height="115" rx="16" fill="#f5f9fc" stroke="#c5d5e3"/><text x="20" y="35" class="t">Geometry and material</text><text x="20" y="68" class="s">R = ρL/A. Resistance belongs to the object; resistivity ρ belongs to the material at a stated temperature.</text><text x="20" y="95" class="s">Metals usually have α &gt; 0; semiconductors often have α &lt; 0; alloys can have very small α.</text></g>
</svg>
