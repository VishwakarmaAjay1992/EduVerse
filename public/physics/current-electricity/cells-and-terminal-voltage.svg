<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560"><defs><style>.h{font:700 28px Arial;fill:#12304d}.t{font:18px Arial;fill:#12304d}.s{font:15px Arial;fill:#47627b}.w{stroke:#12304d;stroke-width:3;fill:none}.r{stroke:#e11d48;stroke-width:4;fill:none}.b{stroke:#2563eb;stroke-width:4;fill:none}</style></defs><rect width="960" height="560" fill="#fff"/><text x="38" y="48" class="h">Real cells and terminal voltage</text>
<g transform="translate(60 100)"><text x="0" y="0" class="t">Discharging cell</text><path d="M40 80H150" class="w"/><line x1="150" y1="45" x2="150" y2="115" class="r"/><line x1="170" y1="60" x2="170" y2="100" class="r"/><path d="M170 80h70l12-20 22 40 22-40 22 40 12-20h80v160H40z" class="w"/><text x="245" y="45" class="s">internal r</text><text x="255" y="150" class="s">load R</text><text x="90" y="250" class="s">V = E - Ir</text></g>
<g transform="translate(500 95)"><text x="0" y="0" class="t">Terminal characteristic</text><line x1="55" y1="220" x2="370" y2="220" class="w"/><line x1="55" y1="220" x2="55" y2="30" class="w"/><line x1="70" y1="55" x2="345" y2="190" class="b"/><text x="70" y="45" class="s">open circuit: V = E</text><text x="250" y="180" class="s">slope = -r</text><text x="350" y="245" class="s">I</text><text x="20" y="40" class="s">V</text></g>
<g transform="translate(90 390)"><rect width="780" height="110" rx="16" fill="#f5f9fc" stroke="#c5d5e3"/><text x="20" y="35" class="t">Grouping identical cells</text><text x="20" y="67" class="s">n cells in each series row and m rows in parallel: Eeq = nE and req = nr/m.</text><text x="20" y="94" class="s">Maximum load power occurs at R = req; this is not the same as maximum efficiency.</text></g></svg>
