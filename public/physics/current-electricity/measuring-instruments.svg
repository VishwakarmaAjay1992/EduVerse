<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560"><defs><style>.h{font:700 28px Arial;fill:#12304d}.t{font:18px Arial;fill:#12304d}.s{font:15px Arial;fill:#47627b}.w{stroke:#12304d;stroke-width:3;fill:none}.b{stroke:#2563eb;stroke-width:4;fill:none}.a{stroke:#f59e0b;stroke-width:4;fill:none}</style></defs><rect width="960" height="560" fill="#fff"/><text x="38" y="48" class="h">From galvanometer to ammeter and voltmeter</text>
<g transform="translate(70 105)"><text x="0" y="0" class="t">Ammeter conversion</text><circle cx="190" cy="135" r="65" fill="#eef7ff" stroke="#12304d" stroke-width="3"/><text x="175" y="146" font-family="Arial" font-size="28" fill="#12304d">G</text><path d="M30 135H125M255 135H360M125 135V260H255V135" class="w"/><rect x="160" y="235" width="65" height="45" rx="8" fill="#fff0c2" stroke="#f59e0b" stroke-width="3"/><text x="185" y="264" class="t">S</text><text x="30" y="330" class="s">Low shunt in parallel; instrument goes in series.</text></g>
<g transform="translate(530 105)"><text x="0" y="0" class="t">Voltmeter conversion</text><circle cx="240" cy="135" r="65" fill="#f5efff" stroke="#12304d" stroke-width="3"/><text x="225" y="146" font-family="Arial" font-size="28" fill="#12304d">G</text><path d="M25 135H100M165 135H175M305 135H400" class="w"/><rect x="100" y="110" width="65" height="50" rx="8" fill="#dff3ff" stroke="#2563eb" stroke-width="3"/><text x="125" y="142" class="t">R</text><text x="40" y="330" class="s">High multiplier in series; instrument goes in parallel.</text></g>
<g transform="translate(110 445)"><rect width="740" height="75" rx="15" fill="#f5f9fc" stroke="#c5d5e3"/><text x="20" y="31" class="s">Ammeter ideal resistance: 0 Ω. Voltmeter ideal resistance: ∞.</text><text x="20" y="57" class="s">Finite resistance creates loading error, so connection and range selection matter.</text></g></svg>
