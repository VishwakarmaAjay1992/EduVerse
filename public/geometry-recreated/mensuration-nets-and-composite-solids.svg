<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640">
  <defs>
    <style>
      .t{font: 18px Arial, sans-serif; fill:#16324f}
      .h{font: 28px Arial, sans-serif; font-weight:700; fill:#16324f}
      .s{font: 16px Arial, sans-serif; fill:#44627c}
      .b{stroke:#16324f; stroke-width:2.5; fill:#e8f8e7}
      .c{stroke:#16324f; stroke-width:2.5; fill:#fff0cc}
      .d{stroke:#16324f; stroke-width:2.5; fill:#dff3ff}
      .f{stroke:#16324f; stroke-width:2; fill:none; stroke-dasharray:7 5}
    </style>
  </defs>
  <rect width="960" height="640" fill="#fff"/>
  <text x="40" y="50" class="h">Nets and composite solids</text>

  <g transform="translate(50,110)">
    <text x="0" y="0" class="t">Cuboid net</text>
    <rect x="90" y="70" width="120" height="90" class="d"/>
    <rect x="90" y="-20" width="120" height="90" class="b"/>
    <rect x="90" y="160" width="120" height="90" class="b"/>
    <rect x="-30" y="70" width="120" height="90" class="c"/>
    <rect x="210" y="70" width="120" height="90" class="c"/>
    <rect x="330" y="70" width="120" height="90" class="d"/>
    <text x="10" y="290" class="s">Add the areas of all 6 faces.</text>
  </g>

  <g transform="translate(510,110)">
    <text x="0" y="0" class="t">Cylinder net</text>
    <ellipse cx="80" cy="35" rx="55" ry="18" class="c"/>
    <rect x="140" y="15" width="190" height="160" class="d"/>
    <ellipse cx="390" cy="35" rx="55" ry="18" class="c"/>
    <text x="140" y="205" class="s">Rectangle width = circumference = 2πr</text>
    <text x="140" y="230" class="s">Rectangle height = cylinder height</text>
  </g>

  <g transform="translate(90,360)">
    <text x="0" y="0" class="t">Composite solid</text>
    <ellipse cx="150" cy="40" rx="70" ry="22" class="c"/>
    <path d="M80,40 L80,170 M220,40 L220,170" class="d"/>
    <ellipse cx="150" cy="170" rx="70" ry="22" class="c"/>
    <path d="M80,170 Q150,260 220,170" class="b"/>
    <line x1="150" y1="40" x2="150" y2="170" class="f"/>
    <text x="265" y="90" class="s">Cylinder + hemisphere</text>
    <text x="265" y="120" class="s">Volume: add both parts</text>
    <text x="265" y="145" class="s">Surface area: ignore hidden join</text>
  </g>

  <g transform="translate(550,360)">
    <rect x="0" y="0" width="310" height="180" rx="18" fill="#f6fbff" stroke="#c6d7e5"/>
    <text x="20" y="35" class="t">When solving composite solids</text>
    <text x="20" y="70" class="s">1. Sketch and label each standard part.</text>
    <text x="20" y="95" class="s">2. Decide whether to add or subtract.</text>
    <text x="20" y="120" class="s">3. Keep only exposed surfaces for total area.</text>
    <text x="20" y="145" class="s">4. Check units at the end.</text>
  </g>
</svg>
