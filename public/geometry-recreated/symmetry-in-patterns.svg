<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <style>
      .h{font: 28px Arial, sans-serif; font-weight:700; fill:#16324f}
      .t{font: 18px Arial, sans-serif; fill:#16324f}
      .s{font: 15px Arial, sans-serif; fill:#44627c}
      .tileA{fill:#dff3ff; stroke:#16324f; stroke-width:2}
      .tileB{fill:#ffe2ea; stroke:#16324f; stroke-width:2}
      .tileC{fill:#e8f8e7; stroke:#16324f; stroke-width:2}
    </style>
  </defs>
  <rect width="960" height="540" fill="#fff"/>
  <text x="30" y="45" class="h">Symmetry in patterns and design</text>
  <g transform="translate(70,100)">
    <text x="0" y="0" class="t">Rosette pattern</text>
    <g transform="translate(130,140)">
      <circle r="28" class="tileA"/>
      <ellipse cx="0" cy="-75" rx="28" ry="55" class="tileB"/>
      <ellipse cx="65" cy="-38" rx="28" ry="55" transform="rotate(60 65 -38)" class="tileB"/>
      <ellipse cx="65" cy="38" rx="28" ry="55" transform="rotate(120 65 38)" class="tileB"/>
      <ellipse cx="0" cy="75" rx="28" ry="55" class="tileB"/>
      <ellipse cx="-65" cy="38" rx="28" ry="55" transform="rotate(60 -65 38)" class="tileB"/>
      <ellipse cx="-65" cy="-38" rx="28" ry="55" transform="rotate(120 -65 -38)" class="tileB"/>
    </g>
    <text x="10" y="320" class="s">Rotational order 6</text>
  </g>
  <g transform="translate(420,100)">
    <text x="0" y="0" class="t">Mirror motif</text>
    <path d="M120,30 C60,60 60,170 120,220 C180,170 180,60 120,30 Z" class="tileC"/>
    <path d="M120,30 C180,60 180,170 120,220" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="40" y="320" class="s">Single line symmetry</text>
  </g>
  <g transform="translate(690,100)">
    <text x="0" y="0" class="t">Tiled design</text>
    <g>
      <rect x="0" y="30" width="70" height="70" class="tileA"/>
      <rect x="70" y="30" width="70" height="70" class="tileB"/>
      <rect x="0" y="100" width="70" height="70" class="tileB"/>
      <rect x="70" y="100" width="70" height="70" class="tileA"/>
      <rect x="140" y="30" width="70" height="70" class="tileC"/>
      <rect x="140" y="100" width="70" height="70" class="tileC"/>
    </g>
    <text x="5" y="320" class="s">Repeated motifs create reflection and translation symmetry</text>
  </g>
</svg>
