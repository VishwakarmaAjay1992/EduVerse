<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620">
  <defs>
    <style>
      .h{font: 28px Arial, sans-serif; font-weight:700; fill:#16324f}
      .t{font: 18px Arial, sans-serif; fill:#16324f}
      .s{font: 15px Arial, sans-serif; fill:#44627c}
      .shape{stroke:#16324f; stroke-width:2.5; fill:#e8f8e7}
      .d{stroke:#0ea5e9; stroke-width:2; stroke-dasharray:7 5}
      .rot{stroke:#d97706; stroke-width:2; fill:none; marker-end:url(#m)}
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#d97706"/>
    </marker>
  </defs>
  <rect width="960" height="620" fill="#fff"/>
  <text x="30" y="45" class="h">Symmetry examples</text>

  <g transform="translate(60,100)">
    <text x="0" y="0" class="t">Square</text>
    <rect x="40" y="30" width="120" height="120" class="shape"/>
    <line x1="100" y1="20" x2="100" y2="170" class="d"/>
    <line x1="30" y1="90" x2="170" y2="90" class="d"/>
    <line x1="35" y1="35" x2="165" y2="165" class="d"/>
    <line x1="165" y1="35" x2="35" y2="165" class="d"/>
    <path d="M100,90 m45,0 a45,45 0 1,1 -1,0" class="rot"/>
    <text x="0" y="200" class="s">4 lines, rotational order 4</text>
  </g>

  <g transform="translate(320,100)">
    <text x="0" y="0" class="t">Parallelogram</text>
    <polygon points="40,140 130,140 180,60 90,60" class="shape"/>
    <path d="M110,100 m35,0 a35,35 0 1,1 -1,0" class="rot"/>
    <text x="0" y="200" class="s">No line symmetry, rotational order 2</text>
  </g>

  <g transform="translate(610,100)">
    <text x="0" y="0" class="t">Regular hexagon</text>
    <polygon points="100,25 155,58 155,122 100,155 45,122 45,58" class="shape"/>
    <line x1="100" y1="10" x2="100" y2="170" class="d"/>
    <line x1="25" y1="90" x2="175" y2="90" class="d"/>
    <path d="M100,90 m45,0 a45,45 0 1,1 -1,0" class="rot"/>
    <text x="0" y="200" class="s">6 lines, rotational order 6</text>
  </g>

  <g transform="translate(180,350)">
    <text x="0" y="0" class="t">Isosceles triangle</text>
    <polygon points="100,20 30,150 170,150" class="shape"/>
    <line x1="100" y1="10" x2="100" y2="160" class="d"/>
    <text x="0" y="190" class="s">1 line of symmetry</text>
  </g>

  <g transform="translate(500,340)">
    <text x="0" y="10" class="t">Circle</text>
    <circle cx="120" cy="100" r="72" class="shape"/>
    <line x1="120" y1="20" x2="120" y2="180" class="d"/>
    <line x1="40" y1="100" x2="200" y2="100" class="d"/>
    <path d="M120,100 m52,0 a52,52 0 1,1 -1,0" class="rot"/>
    <text x="0" y="215" class="s">Infinitely many lines and rotations</text>
  </g>
</svg>
