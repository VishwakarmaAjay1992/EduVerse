<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640">
  <defs>
    <style>
      .h{font: 28px Arial, sans-serif; font-weight:700; fill:#16324f}
      .t{font: 18px Arial, sans-serif; fill:#16324f}
      .s{font: 15px Arial, sans-serif; fill:#44627c}
      .grid{stroke:#d8e4ee; stroke-width:1}
      .axis{stroke:#16324f; stroke-width:2.5}
      .obj{fill:#9fd5ff; stroke:#16324f; stroke-width:2}
      .img{fill:#ffd3a6; stroke:#8b4a00; stroke-width:2}
      .lab{font: 16px Arial, sans-serif; fill:#16324f}
    </style>
  </defs>
  <rect width="960" height="640" fill="#fff"/>
  <text x="30" y="45" class="h">Coordinate transformations</text>

  <g transform="translate(40,90)">
    <text x="0" y="0" class="t">Translation</text>
    <g transform="translate(0,20)">
      <g>
        <path d="M0,150 H220 M110,40 V260" class="axis"/>
        <polygon points="80,170 120,110 145,185" class="obj"/>
        <polygon points="145,120 185,60 210,135" class="img"/>
        <line x1="112" y1="155" x2="177" y2="105" stroke="#d97706" stroke-width="3" marker-end="url(#a)"/>
      </g>
      <text x="0" y="280" class="s">Every point moves by the same vector.</text>
    </g>
  </g>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#d97706"/>
    </marker>
  </defs>

  <g transform="translate(300,90)">
    <text x="0" y="0" class="t">Reflection in y-axis</text>
    <g transform="translate(0,20)">
      <path d="M0,150 H220 M110,40 V260" class="axis"/>
      <polygon points="45,180 95,110 95,205" class="obj"/>
      <polygon points="175,180 125,110 125,205" class="img"/>
      <line x1="110" y1="40" x2="110" y2="260" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="8 5"/>
      <text x="70" y="280" class="s">Mirror line</text>
    </g>
  </g>

  <g transform="translate(560,90)">
    <text x="0" y="0" class="t">Rotation 90° anticlockwise</text>
    <g transform="translate(0,20)">
      <path d="M0,150 H220 M110,40 V260" class="axis"/>
      <polygon points="145,170 185,170 170,110" class="obj"/>
      <polygon points="90,105 90,65 150,80" class="img"/>
      <path d="M170,145 A45 45 0 0 0 135 100" fill="none" stroke="#d97706" stroke-width="3" marker-end="url(#a)"/>
      <circle cx="110" cy="150" r="4" fill="#16324f"/>
    </g>
  </g>

  <g transform="translate(210,380)">
    <text x="0" y="0" class="t">Enlargement from origin, scale factor 2</text>
    <g transform="translate(0,20)">
      <path d="M0,150 H420 M210,20 V280" class="axis"/>
      <polygon points="250,150 280,100 295,165" class="obj"/>
      <polygon points="290,150 350,50 380,180" class="img"/>
      <line x1="210" y1="150" x2="295" y2="165" stroke="#94a3b8" stroke-width="2"/>
      <line x1="210" y1="150" x2="380" y2="180" stroke="#94a3b8" stroke-width="2"/>
      <text x="205" y="300" class="s">Points stay on the same ray from the centre.</text>
    </g>
  </g>
</svg>
